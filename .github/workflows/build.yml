name: Test & Build
on:
  push:
    branches:
      - master

  pull_request:

jobs:
  install-go-modules:
    strategy:
      matrix:
        go: ["1.21.x", "1.20.x", "1.19.x"]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go }}

      - name: Test install Go modules for v${{ matrix.go }}
        run: go install -v . && chamber version

  test:
    strategy:
      matrix:
        go: ["1.21.x", "1.20.x", "1.19.x"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go }}

      - name: Test
        run: make test

      - name: Check modules are tidy and checked in
        run: |
          export GO111MODULE=on
          go mod tidy
          if [ "$(git status --porcelain)" != "" ]; then
            echo "git tree is dirty after tidying modules"
            echo "ensure go.mod and go.sum are tidy"
            git status
            exit 1
          fi

  dist:
    strategy:
      matrix:
        go: ["1.21.x", "1.20.x", "1.19.x"]
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go }}

      - name: Install nfpm, rpmbuild
        run: sudo make -f Makefile.tools nfpm-debian rpmbuild-debian

      - name: Make distributables
        run: make -f Makefile.release dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # v4 no longer merges same-named artifacts across matrix legs the way
          # v3 did — uploading "dist" from all 3 Go versions in parallel would
          # fail with a name conflict. Suffix per matrix leg to keep each one
          # distinct (nothing downloads this artifact by name today, so the
          # suffix has no other effect).
          name: dist-${{ matrix.go }}
          path: "dist/*"
